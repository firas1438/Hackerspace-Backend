spring.application.name=JWT-AuthSystem

spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jackson.serialization.write-dates-as-timestamps=false

server.port=${PORT:8080}

jwt.secret=5f1bca4fd674da0d0d4c01bb165cf91dac538151e5aae07bd94e4ae5abec3762
jwt.access.expiration=900000
jwt.refresh.expiration=604800000

# S3 Object Storage Configuration
aws.s3.endpoint-url=${AWS_ENDPOINT_URL_S3:}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.region=${AWS_REGION:eu-central-1}
aws.s3.bucket=${S3_BUCKET:hackerspace-bucket}

# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

